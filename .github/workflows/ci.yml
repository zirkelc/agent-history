name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Claude Code reads the mod on someone else's machine at install time. This job
  # checks the mod against the current Claude Code, so the CLI is not pinned.
  plugin:
    name: Plugin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      # The native installer ships a binary that needs no Node.
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Validate the plugin
        run: claude plugin validate claude-code
      - name: Test the plugin
        run: claude plugin test claude-code

  # Claude Code updates an installed mod only when the version in the manifest
  # changes. A change to the shipped files without a new version reaches nobody.
  # This job fails until the version is raised.
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check that shipped changes have a new version
        run: |
          # What an installed copy gets: the plugin folder. The README, the
          # recordings and CI stay outside it.
          shipped='claude-code'

          since=$(git log -1 --format=%H -G'"version"' -- claude-code/.claude-plugin/plugin.json)
          [ -n "$since" ] || { echo 'found no version change in claude-code/.claude-plugin/plugin.json'; exit 1; }

          # shellcheck disable=SC2086
          changed=$(git diff --name-only "$since" HEAD -- $shipped)
          if [ -n "$changed" ]; then
            echo "These shipped files changed after the version was last raised in $(git log -1 --format='%h (%s)' "$since"):"
            echo "$changed"
            echo 'Raise the version in claude-code/.claude-plugin/plugin.json.'
            exit 1
          fi
